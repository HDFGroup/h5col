name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The three platforms the pixi lockfile pins: linux-64, osx-arm64,
        # and win-64.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: dev
          cache: true

      - name: Tests
        run: pixi run -e dev test

      - name: Lint
        run: pixi run -e dev lint

      - name: Format check
        run: pixi run -e dev format-check

      - name: Type check
        run: pixi run -e dev typecheck
