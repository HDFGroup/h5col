name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deployments to the github-pages environment must finish, not cancel; PR
# builds still get their own per-ref group.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: docs
          cache: true

      - name: Build the site (warnings are errors)
        run: pixi run docs

      - name: Keep GitHub Pages from running Jekyll
        run: touch docs/_build/html/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html
          # From v4 on, this action drops dotfiles from the archive unless
          # asked to keep them, which would silently discard `.nojekyll`.
          include-hidden-files: true

  # Publishing requires one manual repository setting:
  # Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
