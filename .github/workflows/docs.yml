name: Docs

# Only the inputs the site is actually built from. Anything else — tests,
# design notes, the CI workflow, the README — cannot change a rendered page,
# so it should not spend a build or a deployment. `workflow_dispatch` stays as
# the escape hatch for rebuilding without touching any of these.
# (GitHub Actions does not support YAML anchors, hence the repeated list.)
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - src/h5col/**              # autodoc renders these docstrings
      - examples/*.ipynb          # rendered via the docs/notebooks symlink
      - CHANGELOG.md              # {include} in docs/about/changelog.md
      - LICENSE                   # {literalinclude} in docs/about/license.md
      - pyproject.toml            # the docs environment and the `docs` task
      - pixi.lock                 # pins the docs toolchain
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - src/h5col/**
      - examples/*.ipynb
      - CHANGELOG.md
      - LICENSE
      - pyproject.toml
      - pixi.lock
      - .github/workflows/docs.yml
  workflow_dispatch:

# Deployments to the github-pages environment must finish, not cancel. Builds
# on any other ref are just validation, so a newer push supersedes them.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: docs
          cache: true

      - name: Build the site (warnings are errors)
        run: pixi run docs

      - name: Keep GitHub Pages from running Jekyll
        run: touch docs/_build/html/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html
          # From v4 on, this action drops dotfiles from the archive unless
          # asked to keep them, which would silently discard `.nojekyll`.
          include-hidden-files: true

  # Publishing requires one manual repository setting:
  # Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
